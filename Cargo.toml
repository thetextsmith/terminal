[package]
name = "textsmith"
version = "1.0.0"
edition = "2021"
description = "The Textsmith: a Linux terminal for anyone who works with text, commands and the shell, with bookmarks and a review buffer, written for screen readers first."
license = "GPL-3.0-or-later"
authors = ["Ishe Chinyoka"]
homepage = "https://thetextsmith.com"
repository = "https://github.com/thetextsmith/textsmith"
readme = "README.md"

[[bin]]
name = "textsmith"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
gtk = "0.18"
glib = "0.18"
gdk = "0.18"
pango = "0.18"
atk = "0.18"

[profile.release]
opt-level = 2
debug = false
strip = true
