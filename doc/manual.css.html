<style>
:root { --ink:#1d1b18; --paper:#fbf8f2; --accent:#b4471c; --muted:#6b645a; --code:#f1ebe0; }
@media (prefers-color-scheme: dark) { :root { --ink:#ece6dc; --paper:#1a1816; --accent:#f08a50; --muted:#a59d90; --code:#26231f; } }
body { margin:0 auto; max-width:46rem; padding:2rem 1rem 4rem; background:var(--paper); color:var(--ink);
  font:1.05rem/1.6 system-ui, "Cantarell", "Noto Sans", sans-serif; }
h1, h2, h3 { line-height:1.25; } h1 { font-size:2.1rem; margin-bottom:0; }
h2 { margin-top:2.5rem; padding-top:1rem; border-top:2px solid var(--accent); }
a { color:var(--accent); } .subtitle { color:var(--muted); margin-top:.25rem; }
code, pre { font-family:"DejaVu Sans Mono", "Noto Sans Mono", monospace; font-size:.93em; background:var(--code); border-radius:4px; }
code { padding:.05em .3em; } pre { padding:.8rem 1rem; overflow-x:auto; } pre code { padding:0; background:none; }
table { border-collapse:collapse; width:100%; } th, td { text-align:left; padding:.4rem .6rem; border-bottom:1px solid var(--code); vertical-align:top; }
nav#TOC { background:var(--code); padding:.5rem 1.25rem; border-radius:6px; } nav#TOC ul { padding-left:1.1rem; }
</style>
